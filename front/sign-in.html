<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Neon Player</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/auth-page.js"></script>
</head>
<body>
<main class="auth-page">
  <form class="auth-card panel" id="auth-form" data-mode="sign-in" novalidate>
    <a class="brand" href="./">
      <span class="brand-mark"><span data-icon="music"></span></span>
      <span class="brand-name gradient-text">Neon Player</span>
    </a>
    <h1>Welcome back</h1>
    <p class="lead">Sign in to keep listening.</p>

    <div class="form-error" id="form-error" role="alert" hidden></div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="button" type="submit" id="submit">Sign in</button>
    <p class="auth-switch">New here? <a href="sign-up.html">Create an account</a></p>
  </form>
</main>
</body>
</html>
