<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%239333ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M9.5 16.5V7.5l7-1.5v9' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='7.8' cy='16.5' r='1.8' fill='white'/%3E%3Ccircle cx='14.8' cy='15' r='1.8' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar panel">
    <a class="brand" href="#/">
      <span class="brand-mark"><span data-icon="music"></span></span>
      <span class="brand-name gradient-text">Neon Player</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="#/" data-route="home"><span data-icon="home"></span>All tracks</a>
      <a class="nav-link" href="#/liked" data-route="liked"><span data-icon="heart"></span>Liked<span class="nav-count" id="liked-count"></span></a>
    </nav>

    <div class="profile">
      <div class="avatar guest" id="avatar"><span data-icon="user"></span></div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">Guest</div>
        <div class="profile-sub" id="profile-sub"><a href="sign-in.html">Sign in</a> to listen</div>
      </div>
      <button class="ctrl" id="sign-out" type="button" aria-label="Sign out" title="Sign out" hidden><span data-icon="logout"></span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar panel">
      <div>
        <h1 id="greeting">Welcome to Neon Player</h1>
        <p>Your personal music sanctuary</p>
      </div>
      <label class="search">
        <span class="sr-only">Search</span>
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search artists, albums, or songs…" autocomplete="off">
      </label>
    </header>

    <section class="content panel" aria-labelledby="view-title">
      <div class="content-head">
        <h2 id="view-title">All tracks</h2>
        <span class="meta" id="view-meta"></span>
      </div>
      <ul class="track-list" id="tracks" aria-live="polite"></ul>
      <div id="empty" class="empty" hidden></div>
      <button class="more-button" id="more" type="button" hidden>Show more <span data-icon="chevronDown"></span></button>
    </section>
  </main>
</div>

<footer class="player is-idle" id="player" aria-label="Player">
  <div class="player-inner">
    <div class="now">
      <div class="cover" id="now-cover" style="background: #1f2937"><span data-icon="music"></span></div>
      <div class="now-text">
        <div class="now-title" id="now-title">Nothing playing</div>
        <div class="now-artist" id="now-artist">Pick a track to start</div>
      </div>
      <button class="like-button" id="now-like" type="button" aria-label="Like" aria-pressed="false" hidden><span data-icon="heart"></span></button>
    </div>

    <div class="controls">
      <div class="buttons">
        <button class="ctrl" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle"><span data-icon="shuffle"></span></button>
        <button class="ctrl" id="prev" type="button" aria-label="Previous" title="Previous"><span data-icon="prev"></span></button>
        <button class="play-main" id="play" type="button" aria-label="Play" title="Play (Space)" disabled><span data-icon="play"></span></button>
        <button class="ctrl" id="next" type="button" aria-label="Next" title="Next"><span data-icon="next"></span></button>
        <button class="ctrl" id="repeat" type="button" aria-label="Repeat: off" aria-pressed="false" title="Repeat"><span data-icon="repeat"></span></button>
      </div>
      <div class="progress-row">
        <time id="time-current">0:00</time>
        <input class="range" id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" disabled>
        <time id="time-total">0:00</time>
      </div>
    </div>

    <div class="extras">
      <button class="ctrl" id="mute" type="button" aria-label="Mute" title="Mute"><span data-icon="volume"></span></button>
      <input class="range volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>
</footer>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
