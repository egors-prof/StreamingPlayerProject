basePath: /
definitions:
  httpx.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_adapter_driving_http.LikesResponse:
    properties:
      song_ids:
        items:
          type: integer
        type: array
    type: object
info:
  contact: {}
  description: Лайки пользователя. Все ручки требуют access-токен.
  title: Likes Service API
  version: "2.0"
paths:
  /likes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapter_driving_http.LikesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои лайки
      tags:
      - Likes
  /likes/{songID}:
    delete:
      parameters:
      - description: ID песни
        in: path
        name: songID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Убрать лайк
      tags:
      - Likes
    put:
      parameters:
      - description: ID песни
        in: path
        name: songID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Поставить лайк
      tags:
      - Likes
securityDefinitions:
  BearerAuth:
    description: 'Формат: "Bearer {access_token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
