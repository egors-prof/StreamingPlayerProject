basePath: /
definitions:
  httpx.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_adapter_driving_http.SessionResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      user:
        $ref: '#/definitions/internal_adapter_driving_http.UserResponse'
    type: object
  internal_adapter_driving_http.SignInRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_adapter_driving_http.SignUpRequest:
    properties:
      full_name:
        example: Egor Senatorov
        type: string
      password:
        example: correct-horse-battery
        type: string
      username:
        example: egor
        type: string
    type: object
  internal_adapter_driving_http.UserResponse:
    properties:
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Регистрация, вход, обновление сессии и выход.
  title: Auth Service API
  version: "2.0"
paths:
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Выход
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Меняет refresh-токен из cookie на новую пару токенов (ротация).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapter_driving_http.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Обновить сессию
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Возвращает access-токен в теле и ставит refresh-токен в HttpOnly-cookie.
      parameters:
      - description: логин и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_driving_http.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapter_driving_http.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Вход
      tags:
      - Auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: данные нового пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_driving_http.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_adapter_driving_http.UserResponse'
        "409":
          description: логин занят
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "422":
          description: невалидные данные
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Регистрация
      tags:
      - Auth
swagger: "2.0"
