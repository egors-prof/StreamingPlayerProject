# nginx — единая точка входа (API-шлюз). Отдаёт фронтенд и проксирует
# /api/* в сервисы. Фронт и API на одном адресе, поэтому CORS не нужен,
# а cookie с refresh-токеном работает с SameSite=Strict.

# В логах только путь без query: в query ссылки на трек лежит билет (токен).
log_format noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time rid=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log noquery;
    client_max_body_size 64k;
    server_tokens off;

    # Заголовки безопасности. CSP запрещает загрузку скриптов с чужих
    # доменов: даже при XSS внедрённый код не подтянет внешний скрипт.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Наследуются всеми location ниже.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location / {
        try_files $uri $uri/ =404;
        expires -1; # без кеша: после обновления фронта браузер сразу берёт новые файлы
    }

    location /api/auth/swagger/ {
        proxy_pass http://auth:8284/swagger/;
    }

    location /api/auth/ {
        proxy_pass http://auth:8284/auth/;
    }

    location /api/stream/ {
        proxy_pass http://stream:9999/stream/;
        # Без буферизации nginx не скачивает весь файл к себе, а передаёт
        # его клиенту по мере чтения. Медленный клиент тормозит отдачу
        # в сервисе, и лимит одновременных стримов считается честно.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/likes/swagger/ {
        proxy_pass http://likes:6789/swagger/;
    }

    location /api/likes {
        proxy_pass http://likes:6789/likes;
    }

    location /api/songs {
        proxy_pass http://catalog:8888/songs;
    }
}
